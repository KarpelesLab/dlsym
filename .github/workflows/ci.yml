name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.platform.name }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.95"]
        platform:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-aarch64, os: macos-latest }
          - { name: windows-x86_64-msvc, os: windows-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64-gnu, os: windows-latest, host: x86_64-pc-windows-gnu }
          # 32-bit Windows is where `extern "system"` (stdcall) differs from
          # `extern "C"`, so it exercises the ABI-specific impls.
          - { name: windows-i686-msvc, os: windows-latest, target: i686-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}${{ matrix.platform.host && format('-{0}', matrix.platform.host) || '' }}
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}${{ matrix.platform.host }}
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Test
        shell: bash
        env:
          # The generator's end-to-end test must run, not skip, on 64-bit hosts.
          DLSYM_REQUIRE_E2E: ${{ !matrix.platform.target && '1' || '' }}
          # On Windows, build the test libraries with LLVM's clang (MSVC ABI).
          CC: ${{ runner.os == 'Windows' && 'clang' || '' }}
          CXX: ${{ runner.os == 'Windows' && 'clang++' || '' }}
        run: cargo test --locked --all-features ${{ matrix.platform.target && format('--target {0}', matrix.platform.target) || '' }}

  musl:
    name: test (linux-x86_64-musl, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # JavaScript actions cannot run inside Alpine, so drive it with docker.
      # Dynamic linking (-crt-static) is required: static musl binaries
      # cannot dlopen.
      - name: Test in Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e RUSTFLAGS="-D warnings -C target-feature=-crt-static" \
            -e DLSYM_E2E_RUSTFLAGS="-C target-feature=-crt-static" \
            -e DLSYM_REQUIRE_E2E=1 \
            rust:alpine sh -c '
              apk add --no-cache musl-dev gcc g++ clang-dev &&
              cargo test --locked --all-features
            '

  freebsd:
    name: test (freebsd-x86_64, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl llvm
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            # The generator's end-to-end test is optional here: it runs if
            # the VM's LLVM provides a usable libclang.
            cargo test --locked --all-features

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default features)
        run: cargo clippy --all-targets --locked
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features --locked

  docs:
    name: docs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features --locked

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
