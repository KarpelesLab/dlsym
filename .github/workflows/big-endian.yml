name: Big-endian

# Runs the test suite, including the generator's end-to-end test (which
# checks bitfield layouts against the C compiler), on s390x under QEMU.
# Emulation is slow, so this runs weekly and on demand rather than on every
# push.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  s390x:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Test in an s390x container
        run: |
          docker run --rm --platform linux/s390x -v "$PWD:/w" -w /w \
            -e DLSYM_REQUIRE_E2E=1 \
            ubuntu:24.04 sh -c '
              set -e
              apt-get update -q
              apt-get install -yq --no-install-recommends ca-certificates curl gcc g++ libc6-dev libclang-dev
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cargo test --locked --all-features
            '
