[package]
name = "dlsym"
version = "0.0.3"
edition = "2024"
rust-version = "1.95"
description = "Memory-safe bindings around the platform's dynamic library loading primitives"
keywords = ["dlopen", "dlsym", "ffi", "dynamic", "library"]
categories = ["api-bindings", "external-ffi-bindings", "os", "development-tools::ffi"]
license = "MIT"
authors = ["Karpelès Lab Inc."]
repository = "https://github.com/KarpelesLab/dlsym"
readme = "README.md"
exclude = [".github/"]

[features]
# The C header → Rust bindings generator (`dlsym::codegen` and the
# `dlsym-gen` binary).
codegen = []

[[bin]]
name = "dlsym-gen"
path = "src/bin/dlsym-gen.rs"
required-features = ["codegen"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
