[package]
name = "dlsym-gen"
description = "Generate safe dlsym bindings from C headers"
keywords = ["dlopen", "ffi", "bindings", "codegen", "header"]
categories = ["development-tools::ffi", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "dlsym-gen"
path = "src/main.rs"

[dependencies]
dlsym = { path = "..", version = "0.1.0" }

[lints]
workspace = true
